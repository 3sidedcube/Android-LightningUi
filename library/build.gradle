plugins {
	id 'com.android.library'
}

android {
	compileSdkVersion rootProject.ext.compileSdkVersion

	defaultConfig {
		minSdkVersion rootProject.ext.minSdkVersion
		targetSdkVersion rootProject.ext.targetSdkVersion
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	lintOptions {
		abortOnError false
	}
	namespace 'com.cube.storm.ui'

	publishing {
		singleVariant("release") {
			withSourcesJar()
			withJavadocJar()
		}
	}
}

dependencies {
    implementation files('lib/YouTubeAndroidPlayerApi.jar')

	// androidx libs
	implementation 'androidx.annotation:annotation:1.9.1'
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'androidx.browser:browser:1.9.0'
	implementation 'androidx.cardview:cardview:1.0.0'
	implementation 'androidx.legacy:legacy-support-v13:1.0.0'
	implementation 'androidx.recyclerview:recyclerview:1.4.0'

	implementation 'com.google.android.material:material:1.13.0'

	api 'com.github.aurelhubert:ahbottomnavigation:2.3.4'

	implementation 'com.google.android.exoplayer:exoplayer:2.13.3'
	implementation 'com.github.HaarigerHarald:android-youtubeExtractor:v1.7.0'
	implementation 'com.google.guava:guava:31.1-android'

	implementation 'com.google.code.gson:gson:2.13.2'

	implementation 'com.3sidedcube.storm:util:1.3.0'

	api 'com.3sidedcube.util:universal-image-loader:2.1.2'

	compileOnly 'org.projectlombok:lombok:1.18.40'
	annotationProcessor 'org.projectlombok:lombok:1.18.40'
}

apply from: '../gradle/artifactory.gradle'
